name: Release

# release-please keeps a release PR open with the next version and its CHANGELOG, built from
# the Conventional Commits merged into main. Merging that PR is the approval: it tags the
# version, creates the GitHub release and publishes it to npm here.
#
# release-please works with a token of the organization's GitHub App (the FLASHPI_BOT_CLIENT_ID
# variable and FLASHPI_BOT_PRIVATE_KEY secret). A pull request opened with GITHUB_TOKEN gets
# its CI only after someone approves it, and checks from dispatched runs do not count for the
# required ones; one opened with the App's token runs CI like any other.
#
# npm trusted publishing (OIDC): no npm token is stored anywhere. npmjs.com trusts this
# workflow file (release.yml) of flashpi1/flashpi-node in the `npm` environment, and the
# package gets a provenance statement, which trusted publishing generates by itself. The
# trusted publisher can only be configured once the package exists, so 0.1.0 is published by
# hand first (see CONTRIBUTING.md). The build job installs, checks and packs the release with
# a read-only token and no secret; the publish job, the only one with `id-token: write`, runs
# no code of this repository or of its dependencies: it only publishes that tarball.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-24.04
    # release-please uses the App's token, not GITHUB_TOKEN.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      # A one-hour token for this repository only, with just what release-please needs: push the
      # release branch, tag and release (contents), open the PR (pull requests) and label it
      # (issues). It is revoked when the job ends.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FLASHPI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLASHPI_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # CI runs on the release PR by itself. The live API test spends the demo issuer's daily quota,
  # so it only runs on demand: start it on the release branch whenever release-please updates it.
  live-test:
    name: Live test on the release PR
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true' && needs.release-please.outputs.pr != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
    steps:
      - run: gh workflow run live.yml --ref "$BRANCH"

  # Installing, testing and building run code of this repository and of its dependencies, so
  # they run here, with a read-only token, no secret and no access to npm. The publish job only
  # publishes the tarball this job packed and checked.
  build:
    name: Build the release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      node-version: ${{ steps.node.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No cache in a release build: nothing restored from a cache may reach the release.
      # setup-node caches on its own when package.json names a package manager, so turn that
      # off (pnpm/action-setup does not cache unless asked).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Report the Node.js version for the publish job
        id: node
        run: |
          version=$(tr -d '[:space:]' < .nvmrc)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::.nvmrc does not hold a Node.js version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack:check
      # The tarball `npm publish` would make from this checkout, outside it.
      - name: Pack the release
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mkdir "$RUNNER_TEMP/package"
          npm pack --pack-destination "$RUNNER_TEMP/package"
          expected="flashpi-node-${TAG#v}.tgz"
          packed=$(ls -A "$RUNNER_TEMP/package")
          if [ "$packed" != "$expected" ]; then
            echo "::error::npm pack wrote ${packed}, but the tag ${TAG} needs ${expected}"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          # The publish job waits for the npm environment's approval, for up to 30 days.
          retention-days: 30

  # The only job that can get an npm token (trusted publishing through the `npm` environment,
  # which waits for a maintainer's approval). It checks out nothing, installs nothing and runs
  # no code of this repository or of its dependencies: it downloads the tarball the build job
  # checked and publishes it.
  publish:
    name: Publish to npm
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      id-token: write
    steps:
      # The Node.js of .nvmrc, whose npm (11.5.1 or later) publishes through OIDC. No
      # registry-url (it would write an .npmrc with a token placeholder) and no cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.build.outputs.node-version }}
          package-manager-cache: false
      - name: Check npm can use trusted publishing
        run: |
          version=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$version" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error::npm ${version} cannot publish with trusted publishing: it needs 11.5.1 or later"
            exit 1
          fi
      # Outside any checkout (there is none), in a folder of its own.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Publish
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          tarball="$RUNNER_TEMP/package/flashpi-node-${TAG#v}.tgz"
          if [ -L "$tarball" ] || [ ! -f "$tarball" ]; then
            echo "::error::The artifact has no regular file flashpi-node-${TAG#v}.tgz"
            exit 1
          fi
          npm publish "$tarball" --access public
