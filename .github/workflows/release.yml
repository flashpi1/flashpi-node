name: Release

# release-please keeps a release PR open with the next version and its CHANGELOG, built from
# the Conventional Commits merged into main. Merging that PR is the approval: it tags the
# version, creates the GitHub release and publishes it to npm here.
#
# release-please works with a token of the organization's GitHub App (the FLASHPI_BOT_CLIENT_ID
# variable and FLASHPI_BOT_PRIVATE_KEY secret). A pull request opened with GITHUB_TOKEN gets
# its CI only after someone approves it, and checks from dispatched runs do not count for the
# required ones; one opened with the App's token runs CI like any other.
#
# npm trusted publishing (OIDC): no npm token is stored anywhere. npmjs.com trusts this
# workflow file of flashpi1/flashpi-node, and the package gets a provenance statement. The
# trusted publisher can only be configured once the package exists, so 0.1.0 is published by
# hand first (see CONTRIBUTING.md).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-24.04
    # release-please uses the App's token, not GITHUB_TOKEN.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      # A one-hour token for this repository only, with just what release-please needs: push the
      # release branch, tag and release (contents), open the PR (pull requests) and label it
      # (issues). It is revoked when the job ends.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FLASHPI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLASHPI_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # CI runs on the release PR by itself. The live API test spends the demo issuer's daily quota,
  # so it only runs on demand: start it on the release branch whenever release-please updates it.
  live-test:
    name: Live test on the release PR
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true' && needs.release-please.outputs.pr != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
    steps:
      - run: gh workflow run live.yml --ref "$BRANCH"

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # Node 24 bundles npm 11, which publishes through OIDC. No registry-url (it would write
      # an .npmrc with a token placeholder) and no package cache in a publish job: setup-node
      # caches on its own when package.json names a package manager, so turn that off too.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Publish
        run: npm publish --access public
